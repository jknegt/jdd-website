server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Public — portfolio listing accessible without auth
    location / {
        try_files $uri $uri/ =404;
    }

    # Pink Coffee Party — password: pcp / pcp
    location /portfolio/pink-coffee-party {
        auth_basic "Pink Coffee Party Preview";
        auth_basic_user_file /etc/nginx/.htpasswd-pcp;
        try_files $uri $uri/ =404;
    }

    # NHS Portfolio — password: nhs / nhs (Versions B and D)
    location /portfolio/nhs-b {
        auth_basic "NHS Portfolio Preview";
        auth_basic_user_file /etc/nginx/.htpasswd-nhs;
        try_files $uri $uri/ =404;
    }

    location /portfolio/nhs-d {
        auth_basic "NHS Portfolio Preview";
        auth_basic_user_file /etc/nginx/.htpasswd-nhs;
        try_files $uri $uri/ =404;
    }

    # Future client sites — add location blocks here when each site is deployed:
    #
    # location /portfolio/memoir {
    #     auth_basic "Memoir Preview";
    #     auth_basic_user_file /etc/nginx/.htpasswd-memoir;
    #     try_files $uri $uri/ =404;
    # }
    #
    # location /portfolio/on-the-up-and-up {
    #     auth_basic "On the Up and Up Preview";
    #     auth_basic_user_file /etc/nginx/.htpasswd-ontheupandup;
    #     try_files $uri $uri/ =404;
    # }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
